<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCFA Field Locator & Navigation Suite</title>
    <style>
        /* Base Reset & Layout */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            color: #333;
        }

        /* Top Banner Styles */
        .top-banner {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 15px 20px 10px 20px;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            z-index: 10;
        }

        /* Watermark Subtitle Style */
        .banner-subtitle {
            font-size: 13px;
            font-weight: normal;
            color: #bdc3c7;
            margin-top: 5px;
            display: block;
            letter-spacing: 1px;
        }

        /* Main Workspace Container */
        /* DEFAULT 80% ZOOM SIMULATION */
        .container {
            display: flex;
            width: 100%;
            flex: 1;
            overflow: hidden;
            zoom: 0.8; 
            -moz-transform: scale(0.8);
            -moz-transform-origin: 0 0;
        }

        /* CRITICAL: Image Positioning Container */
        /* Adjusted top padding to 10px to shift the entire image 2mm upward uniformly */
        .form-container {
            position: relative;
            flex: 0 0 1750px; 
            height: 100%;
            overflow: auto;
            background-color: #eef2f5;
            padding: 10px 10px 10px 10px;
            box-sizing: border-box;
            border-right: 2px solid #cfd8dc;
        }

        /* MATCHES IMAGE DIMENSIONS EXACTLY: 1729px x 2230px */
        #ub-form {
            display: block;
            width: 1729px;  
            height: 2230px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            background: #fff;
        }

        /* Right Side Dashboard Panel */
        .dashboard-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            height: 100%;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .panel-content {
            padding: 35px; 
        }

        /* Screen States */
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }

        /* Typography & Components - SCALED LARGER FOR THE RIGHT-SIDE PANE */
        h2 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 32px; 
            border-bottom: 2px solid #eceff1;
            padding-bottom: 12px;
        }

        h3 {
            font-size: 24px !important; 
        }

        .card {
            background: #f8f9fa;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .card p {
            font-size: 20px; 
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #4a5568;
            font-size: 22px; 
        }
        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 22px; 
            box-sizing: border-box;
        }

        .btn {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 24px; 
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #27ae60;
        }
        .btn-retry {
            background: #3498db;
        }
        .btn-retry:hover {
            background: #2980b9;
        }

        /* Game Elements */
        #box-list {
            list-style: none;
            padding: 0;
            margin: 25px 0;
        }
        #box-list li {
            background: #e8f4fd;
            border: 2px solid #3498db;
            color: #2c3e50;
            padding: 25px;
            border-radius: 8px;
            font-size: 28px; 
            font-weight: bold;
            text-align: center;
            box-shadow: 0 4px 6px rgba(52, 152, 219, 0.1);
        }

        /* Timer Progress Bar */
        .timer-container {
            width: 100%;
            background: #e2e8f0;
            height: 16px; 
            border-radius: 8px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        #timer-bar {
            height: 100%;
            width: 100%;
            background: #2ecc71;
            transition: width 0.1s linear, background-color 0.3s;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 25px;
        }
        .stat-box {
            background: #edf2f7;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            font-size: 20px; 
            font-weight: bold;
        }
        .stat-box span {
            display: block;
            font-size: 30px; 
            color: #2b6cb0;
            margin-top: 6px;
        }

        /* Review Lists */
        .bordered-list {
            padding: 0;
            list-style: none;
        }
        .bordered-list li {
            border: 1px solid #cbd5e0;
            padding: 15px 20px;
            margin-bottom: 12px;
            border-radius: 6px;
            background: #fff;
            font-size: 20px; 
        }

        /* Image Map Area Highlights */
        area {
            outline: none;
        }

        /* Animations */
        .fade-in {
            animation: fadeInEffect 0.4s ease-out;
        }
        @keyframes fadeInEffect {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

    <script>
    document.addEventListener('DOMContentLoaded', function () {
        const boxNames = [
            "Box 1 - Plan Type",

            "Box 2 - Patient's Name",
            "Box 3 - Patient's Birth Date, Gender",
            "Box 4 - Insured's Name",

            "Box 7 - Insured's Address",
            "Box 8 - Reserved for NUCC Use",
            "Box 9 - Other Insured's Name",
            "Box 9a - Other Insured's Policy or Group Number",
            "Box 9b - Reserved for NUCC Use",
            "Box 9c - Reserved for NUCC Use",
            "Box 9d - Insurance Plan Name or Program Name",
            "Box 10a, 10b, &amp; 10c - Is Patient's Condition",
            "Box 10d - Claim Codes",
            "Box 11 - Insured's Policy, Group, or FECA Number",
            "Box 11a - Insured's Date of Birth, Gender",
            "Box 11b - Other Claim ID",
            "Box 11c - Insurance Plan Name or Program Name",
            "Box 11d - Is there another Health Benefit Plan",
            "Box 12 - Patient's or Authorized Person's Signature",
            "Box 13 - Insured's or Authorized Person's Signature",
            "Box 14 - Qualifier",
            "Box 14 - Date of Current Illness",
            "Box 15 - Other Date",
            "Box 16 - Dates Patient Unable to Work in Current Occupation",
            "Box 17 - Name of Referring Provider or Other Source",
            "Box 17a - Other ID",
            "Box 17b - NPI",
            "Box 18 - Hospitalization Dates Related to Current Services",
            "Box 19 - Additional Claim Information",
            "Box 20 - Outside Lab and Charges",
            "Box 21 - Diagnosis or Nature of Illness or Injury",
            "Box 21- Indicator",
            "Box 22 - Resubmission Code and Original Ref. No.",
            "Box 23 - Prior Authorization Number",
            "Box 24a - Date of Service(From & TO)",
            "Box 24b - Place of Service",
            "Box 24c - EMG",
            "Box 24d - CPT/HCPCS",
            "Box 24d - Modifier",
            "Box 24e - Diagnosis Code Pointer",
            "Box 24f - Charges",
            "Box 24g - Days or units",
            "Box 24h - EPSDT",
            "Box 24i - ID & Qual",
            "Box 24j - Rendering Provider Id & NPI",
            "Box 25 - Federal Tax ID Number",
            "Box 26 - Patient's Account No.",
            "Box 27 - Accept Assignment",
            "Box 28 - Total Charge",
            "Box 29 - Amount Paid",
            "Box 30 - Reserved for NUCC Use",
            "Box 31 - Signature of Physician or Supplier Including Degrees or Credentials",
            "Box 32 - Service Facility Location Information",
            "Box 32a - NPI",
            "Box 32b - Other ID",
            "Box 33 - Billing Provider Info &amp; Ph",
            "Box 33a - NPI",
            "Box 33b - Other ID"
        ];

        // Screens
        const setupScreen = document.getElementById('setup-screen');
        const gameScreen = document.getElementById('game-screen');
        const resultsScreen = document.getElementById('results-screen');

        // Dynamic Elements
        const boxList = document.getElementById('box-list');
        const scoreElement = document.getElementById('score');
        const attemptsElement = document.getElementById('attempts');
        const streakElement = document.getElementById('streak');
        const timeText = document.getElementById('time-text');
        const timerBar = document.getElementById('timer-bar');
        
        // FIXED TYPO HERE: Space added between const and resultsContent
        const resultsContent = document.getElementById('results-content');

        // Config Controls
        let maxAttempts = 10;
        let timePerQuestion = 15; 
        
        // State Engines
        let quizPool = [];
        let currentBoxName = '';
        let score = 0;
        let attempts = 0;
        let currentStreak = 0;
        let startTime = 0;
        
        // Timer intervals
        let questionTimerInterval = null;
        let timeRemaining = 0;

        const wrongClicks = [];
        const correctClicks = [];
        let redBox = null;

        // Native Synth Sound Engine
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                if (type === 'correct') {
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(783.99, audioCtx.currentTime + 0.08); 
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.12);
                } else {
                    osc.frequency.setValueAtTime(220.00, audioCtx.currentTime); 
                    osc.frequency.linearRampToValueAtTime(130.81, audioCtx.currentTime + 0.18); 
                    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.22);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.22);
                }
            } catch(e) {}
        }

        // Shuffler
        function shuffleArray(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        // Interactive UI Micro-Interactions (Floating Feedback)
        function spawnFeedback(e, isCorrect) {
            const feedback = document.createElement('div');
            feedback.innerText = isCorrect ? '👍' : '👎';
            feedback.style.position = 'absolute';
            feedback.style.left = `${e.pageX - 15}px`;
            feedback.style.top = `${e.pageY - 15}px`;
            feedback.style.fontSize = '45px'; 
            feedback.style.pointerEvents = 'none';
            feedback.style.zIndex = '2000';
            feedback.style.transition = 'all 0.6s ease-out';
            
            // UPDATED: Forced Dark Green and Dark Red Emoji Profiles
            if (isCorrect) {
                feedback.style.filter = 'hue-rotate(90deg) brightness(0.6) drop-shadow(0px 0px 8px #1b5e20)';
            } else {
                feedback.style.filter = 'hue-rotate(300deg) brightness(0.6) drop-shadow(0px 0px 8px #b71c1c)';
            }
            
            document.body.appendChild(feedback);

            requestAnimationFrame(() => {
                feedback.style.transform = 'translateY(-50px) scale(1.3)';
                feedback.style.opacity = '0';
            });
            setTimeout(() => feedback.remove(), 600);
        }

        // Start Setup Handler
        document.getElementById('start-game-btn').addEventListener('click', function() {
            const qInput = parseInt(document.getElementById('input-questions').value);
            const tInput = parseInt(document.getElementById('input-timer').value);

            maxAttempts = isNaN(qInput) ? 10 : Math.min(Math.max(qInput, 1), boxNames.length);
            timePerQuestion = isNaN(tInput) ? 15 : Math.min(Math.max(tInput, 3), 60);

            quizPool = shuffleArray([...boxNames]).slice(0, maxAttempts);
            
            setupScreen.classList.remove('active');
            gameScreen.classList.add('active');
            
            startTime = Date.now();
            showNextQuestion();
        });

        function showNextQuestion() {
            clearInterval(questionTimerInterval);
            if (attempts >= maxAttempts) {
                displayResults();
                return;
            }

            currentBoxName = quizPool[attempts];
            boxList.innerHTML = `<li class="fade-in">${currentBoxName}</li>`;
            
            attemptsElement.textContent = maxAttempts - attempts;
            scoreElement.textContent = score;
            streakElement.textContent = currentStreak;

            initQuestionTimer();
        }

        function initQuestionTimer() {
            timeRemaining = timePerQuestion;
            timeText.textContent = `${timeRemaining}s`;
            timerBar.style.width = '100%';
            timerBar.style.backgroundColor = '#2ecc71';

            questionTimerInterval = setInterval(() => {
                timeRemaining--;
                timeText.textContent = `${timeRemaining}s`;
                
                let percentage = (timeRemaining / timePerQuestion) * 100;
                timerBar.style.width = `${percentage}%`;

                if (percentage < 30) {
                    timerBar.style.backgroundColor = '#e74c3c'; 
                } else if (percentage < 60) {
                    timerBar.style.backgroundColor = '#f1c40f'; 
                }

                if (timeRemaining <= 0) {
                    clearInterval(questionTimerInterval);
                    handleFailure(null, true); 
                }
            }, 1000);
        }

        function checkBoxSelection(name, clickEvent) {
            clearInterval(questionTimerInterval);
            const isCorrect = (name === currentBoxName);
            
            if (isCorrect) {
                playSound('correct');
                if(clickEvent) spawnFeedback(clickEvent, true);
                score++;
                currentStreak++;
                correctClicks.push({ name: currentBoxName });
            } else {
                handleFailure(clickEvent, false);
                return;
            }

            attempts++;
            showNextQuestion();
        }

        function handleFailure(clickEvent, isTimeout) {
            playSound('wrong');
            if (clickEvent && !isTimeout) spawnFeedback(clickEvent, false);
            
            currentStreak = 0;
            wrongClicks.push({ 
                correct: currentBoxName, 
                reason: isTimeout ? 'Timed out' : 'Incorrect Selection' 
            });

            attempts++;
            showNextQuestion();
        }

        function displayResults() {
            clearInterval(questionTimerInterval);
            gameScreen.classList.remove('active');
            resultsScreen.classList.add('active');

            const elapsedTotal = ((Date.now() - startTime) / 1000).toFixed(1);
            const finalPercentage = ((score / maxAttempts) * 100).toFixed(1);

            let wrongSummaryHtml = "<h3 style='color:#e74c3c; margin-top:25px;'>❌ Areas For Review:</h3><ul class='bordered-list'>";
            wrongClicks.forEach((item, index) => {
                wrongSummaryHtml += `
                    <li id="review-item-${index}" style="cursor:pointer; transition: background 0.2s;" onmouseover="this.style.backgroundColor='#fdf2f2'" onmouseout="this.style.backgroundColor='#fff'">
                        🔍 <b>${item.correct}</b> <span style="color:#7f8c8d; font-size:16px;">(${item.reason} - Click to check location)</span>
                    </li>`;
            });
            wrongSummaryHtml += "</ul>";

            let correctSummaryHtml = "<h3 style='color:#2ecc71; margin-top:25px;'>✅ Mastered Fields:</h3><ul class='bordered-list'>";
            correctClicks.forEach((item) => {
                correctSummaryHtml += `<li>Item Located: <b>${item.name}</b></li>`;
            });
            correctSummaryHtml += "</ul>";

            resultsContent.innerHTML = `
                <div class="card" style="text-align:center;">
                    <p style="font-size: 30px; margin:0 0 15px 0;">🎉 Evaluation Complete!</p>
                    <p style="font-size: 46px; font-weight:bold; color:#2980b9; margin:15px 0;">${finalPercentage}%</p>
                    <p style="font-size: 20px;">Accurately checked <b>${score}</b> out of <b>${maxAttempts}</b> total target items.</p>
                    <p style="color:#7f8c8d; font-size: 18px;">Total operational time: ${elapsedTotal} seconds.</p>
                    <button id="reload-app-btn" class="btn btn-retry" style="margin-top:15px;">Configure New Session</button>
                </div>
                ${wrongClicks.length > 0 ? wrongSummaryHtml : "<p style='color:#2ecc71; font-weight:bold; font-size:24px; text-align:center;'>🎯 Perfect Score! Your accuracy profile is exemplary.</p>"}
                ${correctClicks.length > 0 ? correctSummaryHtml : ""}
            `;

            document.getElementById('reload-app-btn').addEventListener('click', () => {
                location.reload();
            });

            wrongClicks.forEach((item, index) => {
                document.getElementById(`review-item-${index}`).addEventListener('click', function() {
                    highlightCorrectBox(item.correct);
                });
            });
        }

        // Coordinates Border Drawer Function
        function createRedBox(coords) {
            removeRedBox(); 
            const [left, top, right, bottom] = coords.split(',').map(Number);
            
            redBox = document.createElement('div');
            redBox.style.position = 'absolute';
            redBox.style.border = '3px dashed #e74c3c'; 
            redBox.style.backgroundColor = 'rgba(231, 76, 60, 0.18)';
            redBox.style.pointerEvents = 'none';
            
            redBox.style.left = `${left + 10}px`;   
            redBox.style.top = `${top + 10}px`;     
            redBox.style.width = `${right - left}px`;
            redBox.style.height = `${bottom - top}px`;
            
            document.querySelector('.form-container').appendChild(redBox);
        }

        function removeRedBox() {
            if (redBox) {
                redBox.remove();
                redBox = null;
            }
        }

        function highlightCorrectBox(fieldName) {
            const areaTarget = Array.from(document.querySelectorAll('area')).find(area => {
                const dataBox = area.dataset.box;
                return dataBox === fieldName || dataBox.replace(/&amp;/g, '&') === fieldName;
            });
            
            if (areaTarget) {
                createRedBox(areaTarget.coords);
                
                const [left, top] = areaTarget.coords.split(',').map(Number);
                document.querySelector('.form-container').scrollTo({
                    top: top - 50,
                    behavior: 'smooth'
                });

                let flashCycle = 0;
                const flashTimer = setInterval(() => {
                    if (redBox) redBox.style.opacity = (redBox.style.opacity === '0' ? '1' : '0');
                    if (++flashCycle > 10) {
                        clearInterval(flashTimer);
                        if (redBox) redBox.style.opacity = '1';
                    }
                }, 150);
            }
        }

        // Image Map Listeners Initialization
        document.querySelectorAll('area').forEach(area => {
            area.addEventListener('click', function (e) {
                e.preventDefault();
                if (gameScreen.classList.contains('active')) {
                    checkBoxSelection(this.dataset.box.replace(/&amp;/g, '&'), e);
                }
            });

            area.addEventListener('mouseover', function () {
                if (gameScreen.classList.contains('active')) {
                    createRedBox(this.coords);
                }
            });

            area.addEventListener('mouseout', function () {
                removeRedBox();
            });
        });
    });
    </script>
</body>
</html>
